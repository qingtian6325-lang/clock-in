<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-glow: rgba(37, 99, 235, 0.28);
    --success: #10b981;
    --success-glow: rgba(16, 185, 129, 0.28);
    --warning: #f59e0b;
    --warning-glow: rgba(245, 158, 11, 0.28);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --surface: rgba(255, 255, 255, 0.88);
    --surface-border: rgba(255, 255, 255, 0.95);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-soft: 0 16px 36px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --bg-img: url('bg.jpg');
    background: 
      radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
      linear-gradient(rgba(248, 250, 252, 0.92), rgba(248, 250, 252, 0.92)),
      var(--bg-img) center top / cover no-repeat fixed;
    color: var(--text-main);
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 36px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }

  .logo-wrap {
    text-align: center;
    margin: 6px 0 14px;
  }

  .logo {
    max-width: 190px;
    height: auto;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.05));
    transition: transform 0.3s ease;
  }
  .logo:hover {
    transform: scale(1.02);
  }

  h1 {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: -0.2px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .clock {
    text-align: center;
    margin: 0 0 24px;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--surface-border);
    box-shadow: var(--shadow-soft);
  }

  .clock .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: #0f172a;
    line-height: 1.1;
  }

  .clock .date {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 8px;
    letter-spacing: 0.2px;
  }

  .card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    padding: 26px 22px;
    border: 1px solid var(--surface-border);
    box-shadow: var(--shadow-soft);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    padding: 15px 18px;
    font-size: 17px;
    font-weight: 600;
    border: 1.5px solid #e2e8f0;
    border-radius: var(--radius-md);
    background: #ffffff;
    color: var(--text-main);
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-glow);
  }

  input::placeholder {
    color: #94a3b8;
    font-weight: 400;
  }

  .name-line {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    margin: 14px 0 18px;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-muted);
    transition: all 0.2s ease;
  }

  .name-line.ok {
    color: #047857;
    background: #ecfdf5;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 700;
    display: inline-flex;
    margin: 12px auto 16px;
  }

  .name-line.err {
    color: #b91c1c;
    background: #fef2f2;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    display: inline-flex;
    margin: 12px auto 16px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    padding: 18px 10px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-in {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    box-shadow: 0 8px 18px -4px var(--success-glow);
  }
  .btn-in:hover:not(:disabled) {
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
    box-shadow: 0 10px 22px -4px var(--success-glow);
  }

  .btn-out {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    box-shadow: 0 8px 18px -4px var(--warning-glow);
  }
  .btn-out:hover:not(:disabled) {
    background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
    box-shadow: 0 10px 22px -4px var(--warning-glow);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    filter: grayscale(25%);
    transform: none;
  }

  .status {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    min-height: 22px;
  }

  .msg {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    min-height: 24px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    transition: all 0.25s ease;
  }

  .msg.ok {
    color: #065f46;
    background: #d1fae5;
  }

  .msg.err {
    color: #991b1b;
    background: #fee2e2;
  }

  .onsite {
    margin-top: 18px;
    padding: 22px 22px;
  }

  .onsite-head {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #1e293b;
  }

  .onsite-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .onsite-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid #f1f5f9;
    font-size: 14px;
    font-weight: 600;
  }

  .onsite-row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    flex: none;
  }

  .dim { color: #94a3b8; font-size: 13px; font-weight: 500; }
  .hidden { display: none !important; }

  .warn {
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: var(--radius-md);
    padding: 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }

  .foot {
    text-align: center;
    margin-top: 20px;
  }

  .foot a {
    color: #94a3b8;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
    padding: 6px 14px;
    border-radius: 8px;
  }
  .foot a:hover {
    color: var(--primary);
    background: rgba(37, 99, 235, 0.06);
  }

  .footer {
    text-align: center;
    margin: 32px 0 8px;
    padding: 16px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, #1e40af 0%, #6366f1 100%);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.35);
  }
  .footer a { color: #ffffff; text-decoration: underline; text-underline-offset: 3px; }

  .clip-overlay {
    position: fixed; inset: 0; z-index: 9999; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .clip-overlay.hidden { display: none; }
  .clip-overlay video { width: 100%; height: 100%; object-fit: contain; }
  .clip-hint { position: absolute; bottom: 24px; width: 100%; text-align: center;
               color: rgba(255,255,255,.6); font-size: 14px; }
</style>
</head>
<body>

<div class="logo-wrap"><img src="logo.png" alt="Wiwynn" class="logo"></div>
<h1>📋 Attendance System</h1>
<div class="clock">
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date"></div>
</div>

<div id="cfgWarn" class="warn hidden">⚠️ Database connection not configured. Please complete the setup in README.</div>

<div class="card">
  <label>Staff ID</label>
  <input id="staffId" placeholder="Enter staff ID, e.g. YM1234567" autocomplete="off" autocapitalize="characters">
  <div class="name-line" id="empNameLine">Enter your staff ID</div>
  <div class="btn-row">
    <button class="btn btn-in" id="btnIn" onclick="doClock('in')">Clock In</button>
    <button class="btn btn-out" id="btnOut" onclick="doClock('out')">Clock Out</button>
  </div>
  <div class="status" id="status"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card onsite">
  <div class="onsite-head">🟢 <span id="onsiteTitle">On-site now</span></div>
  <div id="onsiteList" class="onsite-list"><span class="dim">Loading…</span></div>
</div>

<div class="foot"><a href="admin.html">⚙️ Management Console (Admin)</a></div>

<!-- intro clip -->
<div id="clipOverlay" class="clip-overlay hidden">
  <video id="clipVideo" src="clip.mp4" playsinline preload="auto"></video>
  <div class="clip-hint">tap to dismiss</div>
</div>

<script src="supabase.min.js?v=20261005a"></script>
<script src="config.js?v=20261005a"></script>
<script>
const CFG = window.APP_CONFIG || {};
const TZ = 'Asia/Kuala_Lumpur';
// Location capture on clock in/out (GPS). Set false to disable.
const LOCATION_ENABLED = false;
// Staff ID -> custom background image (in docs/). Uppercase IDs.
// Example: 'YM2608209': 'bg-jinghao.jpg',
const STAFF_BG = {
};
// Staff IDs that trigger the intro clip (full-screen video, a few seconds)
const CLIP_IDS = ['YM1234567'];
let clipPlayedFor = '';

function maybeClip(id) {
  const uid = id.toUpperCase();
  if (CLIP_IDS.includes(uid) && clipPlayedFor !== uid) {
    clipPlayedFor = uid;
    const ov = document.getElementById('clipOverlay');
    const vid = document.getElementById('clipVideo');
    ov.classList.remove('hidden');
    vid.currentTime = 0;
    vid.muted = false;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  } else if (!CLIP_IDS.includes(uid)) {
    clipPlayedFor = '';
  }
}
function hideClip() {
  document.getElementById('clipOverlay').classList.add('hidden');
  const vid = document.getElementById('clipVideo');
  vid.pause();
}
document.getElementById('clipVideo').addEventListener('ended', hideClip);
document.getElementById('clipOverlay').addEventListener('click', hideClip);
let sb = null;
let currentEmpId = null;
let lookupTimer = null;

function showWarn(text) {
  const w = document.getElementById('cfgWarn');
  if (text) w.textContent = text;
  w.classList.remove('hidden');
}
function hideWarn() {
  document.getElementById('cfgWarn').classList.add('hidden');
}
function cfgOk() {
  return !!(CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('your-project'));
}

// DB init is wrapped so the live clock keeps running even if it fails
(function initDb() {
  if (!cfgOk()) { showWarn(); return; }  // default text = not configured
  try {
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    hideWarn();
  } catch (e) {
    showWarn('⚠️ Failed to start the database library. Please refresh the page.');
  }
})();
refreshOnsite();

// Live clock
function tick() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('time').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('date').textContent =
    d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();

function fmt(ts) {
  return new Date(ts).toLocaleString('en-GB', { timeZone: TZ, hour12: false });
}

function say(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Who's currently clocked in (on-site now). Refreshes every minute + after each clock action.
async function refreshOnsite() {
  if (!sb) return;
  try {
    const { data, error } = await sb.rpc('active_now');
    if (error) throw error;
    const list = data || [];
    document.getElementById('onsiteTitle').textContent = `On-site now (${list.length})`;
    document.getElementById('onsiteList').innerHTML = list.length
      ? list.map(item => {
          const name = typeof item === 'string' ? item : item.name;
          const sid = typeof item === 'string' ? '' : (item.staff_id || '');
          return `<div class="onsite-row"><span class="dot"></span>${escapeHtml(name)}${sid ? ` <span class="dim">${escapeHtml(sid)}</span>` : ''}</div>`;
        }).join('')
      : '<span class="dim">Nobody on-site right now</span>';
  } catch (e) { /* keep last good state on failure */ }
}
setInterval(refreshOnsite, 60000);

// Type staff ID -> name appears automatically (debounced 500ms)
document.getElementById('staffId').addEventListener('input', () => {
  clearTimeout(lookupTimer);
  currentEmpId = null;
  const v = document.getElementById('staffId').value.trim();
  // custom background for specific staff IDs (empty/no match -> default)
  const bg = STAFF_BG[v.toUpperCase()];
  document.body.style.setProperty('--bg-img', bg ? `url('${bg}')` : `url('bg.jpg')`);
  maybeClip(v);
  const line = document.getElementById('empNameLine');
  line.className = 'name-line';
  if (!v) { line.textContent = 'Enter your staff ID'; updateStatus(); return; }
  line.textContent = 'Searching…';
  lookupTimer = setTimeout(() => lookupEmployee(v), 500);
});

async function lookupEmployee(staffId) {
  const line = document.getElementById('empNameLine');
  try {
    const { data, error } = await sb.rpc('lookup_employee', { p_staff_id: staffId });
    if (error) throw error;
    if (!data.ok) {
      line.textContent = '❌ ' + data.msg;
      line.className = 'name-line err';
      currentEmpId = null;
    } else {
      line.textContent = '👤 ' + data.name;
      line.className = 'name-line ok';
      currentEmpId = data.id;
    }
  } catch (e) {
    line.textContent = '❌ Lookup failed, please check your connection';
    line.className = 'name-line err';
    currentEmpId = null;
  }
  updateStatus();
}

async function doClock(action) {
  if (!sb) return;
  if (!currentEmpId) { say('Please enter a valid staff ID first', false); return; }
  setClockBusy(true);
  if (LOCATION_ENABLED) say('📍 Getting your location…', null);
  const loc = LOCATION_ENABLED ? await getPosition() : null;
  const { data, error } = await sb.rpc('clock',
    { p_emp_id: currentEmpId, p_action: action,
      p_lat: loc ? loc.lat : null, p_lng: loc ? loc.lng : null });
  setClockBusy(false);
  if (error) { say('❌ Network error, please try again', false); return; }
  let text = (data.ok ? '✅ ' : '❌ ') + data.msg + (data.ts ? ` (${fmt(data.ts)})` : '');
  if (LOCATION_ENABLED && data.ok && !loc) text += ' — ⚠️ location not captured';
  say(text, data.ok);
  updateStatus();
  refreshOnsite();
}

function setClockBusy(busy) {
  document.getElementById('btnIn').disabled = busy;
  document.getElementById('btnOut').disabled = busy;
}

// GPS position for the clock record (null if unavailable/denied)
function getPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    let done = false;
    const finish = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
    const timer = setTimeout(() => finish(null), 10000);
    navigator.geolocation.getCurrentPosition(
      pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => finish(null),
      { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 }
    );
  });
}

async function updateStatus() {
  if (!sb) return;
  const s = document.getElementById('status');
  if (!currentEmpId) { s.textContent = ''; return; }
  const { data } = await sb.rpc('my_records', { p_emp_id: currentEmpId });
  const last = data && data[0];
  if (!last) s.textContent = 'Not clocked in yet today';
  else if (last.action === 'in') s.textContent = `🟢 Clocked in at ${fmt(last.ts)}`;
  else s.textContent = `🔵 Clocked out at ${fmt(last.ts)}`;
}
</script>
<div class="footer">⚡ Powered by <a href="mailto:Jinghao_Tee@wiwynn.com">Jinghao_Tee@wiwynn.com</a> &amp; <a href="https://muse.ai" target="_blank" rel="noopener">Muse</a></div>
</body>
</html>
